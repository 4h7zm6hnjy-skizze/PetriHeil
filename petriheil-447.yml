name: Petri Heil Pro 4.4.7 installieren

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/petriheil-447.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: petriheil-update-447
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == '4h7zm6hnjy-skizze/PetriHeil'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Bestehendes Projekt laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Originalversion und Update-Skript prüfen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          v = json.loads(Path('version.json').read_text(encoding='utf-8'))['version']
          if v != '4.4.6':
              raise SystemExit(f'Abbruch: Erwartet Version 4.4.6, gefunden {v}. Keine Dateien verändert.')
          script=Path('update_petriheil.py')
          if not script.is_file():
              raise SystemExit('Abbruch: update_petriheil.py fehlt im Repository.')
          print('Projektversion:',v,'– Skript vorhanden')
          PY

      - name: Vollversion erzeugen und Updates in Arbeitsverzeichnis übernehmen
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from update_petriheil import load_source, patch

          original=load_source(Path('.'))
          updated,changed=patch(original)
          if len(changed) < 45 or len(updated) < 600:
              raise SystemExit('Abbruch: Unerwartet wenige Dateien; falsches Projektarchiv?')
          target=Path('/tmp/PetriHeilPro_4.4.7_Vollversion.zip')
          with ZipFile(target,'w',ZIP_DEFLATED,compresslevel=6) as z:
              for name,data in updated.items():
                  z.writestr(name,data)
          for name in changed:
              path=Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(updated[name])
          Path('/tmp/petriheil447_changed.txt').write_text('\n'.join(changed)+'\n',encoding='utf-8')
          print('Update-Dateien:',len(changed),'– vorhandene Gesamtdateien:',len(updated))
          print('Vollversion:',target,'(',target.stat().st_size,'Bytes )')
          PY

      - name: JavaScript, HTML und Offline-Manifest prüfen
        shell: bash
        run: |
          node --check petri442-map.js
          node --check petri440-app.js
          node --check petri-sw.js
          node --check petri445-nav.js
          node --check petri-offline-v4.4.7.js
          node --check sw.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          from update_petriheil import HTML_PAGES
          assert json.loads(Path('version.json').read_text())['version']=='4.4.7'
          manifest=json.loads(Path('petri-core-v4.4.7.json').read_text())
          files=manifest['files']
          assert manifest['version']=='4.4.7'
          assert len(files)>=120 and len(files)==len(set(files))
          for f in files:
              assert Path(f.split('?')[0]).is_file(),f'Fehlendes Offline-Medium: {f}'
          for name in HTML_PAGES:
              content=Path(name).read_text(encoding='utf-8-sig')
              assert content.count('petri445-nav.js')==1,f'Zurück-Navigation: {name}'
          for name in ['index.html','petri440.html']:
              assert 'name="petri-app-version" content="4.4.7"' in Path(name).read_text()
          print('OK: 37 App-Seiten,',len(files),'Offline-Kern-Dateien, Version 4.4.7')
          PY

      - name: Vollständiges Projekt als ZIP bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PetriHeilPro-4.4.7-Vollversion
          path: /tmp/PetriHeilPro_4.4.7_Vollversion.zip
          if-no-files-found: error
          retention-days: 30

      - name: App-Update nach GitHub main übertragen
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/petriheil447_changed.txt
          if git diff --cached --quiet; then
            echo 'Keine Änderungen erforderlich.'
          else
            git commit -m 'Petri Heil Pro 4.4.7: Kartenzoom, Zurück-Navigation, Offline-Prüfung'
            git push origin HEAD:main
          fi
